# Pubblica la guida su GitHub Pages a ogni push su main. Serve una volta: Settings → Pages → Source: GitHub Actions.
name: Guida su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.distribuzione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copia del sito senza i file del repo
        run: rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: distribuzione
        uses: actions/deploy-pages@v4
